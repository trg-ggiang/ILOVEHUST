# Repository-local Codex defaults for ILoveHust.
# Keep this file conservative; per-user secrets and global preferences belong in ~/.codex/config.toml.

model_reasoning_effort = "medium"

[project]
name = "ILoveHust"
type = "full-stack-typescript"
default_shell = "powershell"

[safety]
approval_policy = "on-request"
filesystem = "workspace-write"
network_access = "restricted"
protect_secrets = true
require_confirmation_for_destructive_commands = true

[commands]
backend_build = "cd backend; npm run build"
backend_dev = "cd backend; npm run dev"
backend_prisma_generate = "cd backend; npm run prisma:generate"
frontend_build = "cd frontend; npm run build"
frontend_lint = "cd frontend; npm run lint"
frontend_dev = "cd frontend; npm run dev"

[paths]
backend = "backend"
frontend = "frontend"
prisma_schema = "backend/prisma/schema.prisma"
frontend_styles = "frontend/src/styles.css"

[files]
agent_instructions = "AGENTS.md"
api_docs = "docs/API.md"
database_docs = "docs/DATABASE.md"
ui_rules = "docs/UI_RULES.md"

